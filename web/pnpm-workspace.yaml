# Only releases at least 10 days old, as Renovate proposes them (`renovate.json`): pnpm keeps to
# it at every resolution, transitive packages and Renovate's lock runs included. A security fix
# that is younger gets an entry in `minimumReleaseAgeExclude` for its package
# (.knowledge/process/dependencies.md).
minimumReleaseAge: 14400

# swagger-ui-dist depends on Scarf, whose install script reports the installation to scarf.sh:
# never run it (08.11.2026).
allowBuilds:
  '@scarf/scarf': false
