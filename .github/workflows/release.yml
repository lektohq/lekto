---
name: Release

# The images of a release, published on ghcr.io when the release is published: `lekto` (all
# roles) and `lekto-migration` (the migration client). No layer cache is used: each image and
# architecture builds on a runner of its own; `lekto` is first loaded and tested with
# `deploy/test-image.sh` (the very artifact, with its version: the CI tested the image of the pull
# request, not the merge), then pushed by digest from the same build. Then one manifest per image
# gets the tags (`.github/scripts/image_tags.py`: the version, `beta` or `stable`, `latest`).
# `lekto-migration` is built only when something in `migration/` (its code, its locked
# dependencies, its Dockerfile) changed since the previous published release; otherwise that
# release's image gets this release's tags, without a new image.
# By hand (`workflow_dispatch`) the images of a published release are built again, both.
# Last, a published release whose `lekto` image got `latest` tells the homelab
# its version by `repository_dispatch` (repository in the secret `HOMELAB_DISPATCH_REPO`); the
# homelab enters and deploys it.
# Only in tb1337/lekto-dms itself: a fork never tells the homelab anything.

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of a published release (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

# One release at a time: the channel tags must not race.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  tags:
    name: 🏷️ Tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.tags.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
      previous: ${{ steps.tags.outputs.previous }}
      revision: ${{ steps.revision.outputs.revision }}
      migration: ${{ steps.migration.outputs.migration }}
      images: ${{ steps.migration.outputs.images }}
    steps:
      - name: ⤵️ Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # The previous release's tag too: what changed in `migration/` since then.
          fetch-depth: 0
      - name: 🔖 Revision
        id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 🏷️ Which tags the images get
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::$TAG is no published release"
            exit 1
          fi
          gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' \
            | python3 .github/scripts/image_tags.py "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: 🔑 Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔀 Whether lekto-migration is built
        id: migration
        env:
          PREVIOUS: ${{ steps.tags.outputs.previous }}
          IMAGE: ${{ env.REGISTRY }}/lekto-migration
        run: |
          migration=build
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Built again by hand: built"
          elif [ -z "$PREVIOUS" ]; then
            echo "No release before: built"
          elif ! git diff --quiet "$PREVIOUS" HEAD -- migration/; then
            echo "migration/ changed since $PREVIOUS: built"
            git diff --stat "$PREVIOUS" HEAD -- migration/
          elif ! docker buildx imagetools inspect "$IMAGE:${PREVIOUS#v}" > /dev/null; then
            echo "::warning::$IMAGE:${PREVIOUS#v} is missing: built"
          else
            echo "migration/ unchanged since $PREVIOUS: its image gets the tags"
            migration=reuse
          fi
          lekto='{"name":"lekto","context":".","file":"Dockerfile","target":"runtime"}'
          client='{"name":"lekto-migration","context":"migration","file":"migration/Dockerfile","target":""}'
          if [ "$migration" = "build" ]; then images="[$lekto,$client]"; else images="[$lekto]"; fi
          {
            echo "migration=$migration"
            echo "images=$images"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: 🏗️ ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: tags
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # `lekto`, and `lekto-migration` when it is built (`tags`).
        image: ${{ fromJSON(needs.tags.outputs.images) }}
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: ⤵️ Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 🔑 Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧪 Build and test the image
        if: matrix.image.name == 'lekto'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: LEKTO_VERSION=${{ needs.tags.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.tags.outputs.revision }}
          load: true
          tags: lekto:release
      - name: 🧪 Test the image
        if: matrix.image.name == 'lekto'
        run: deploy/test-image.sh lekto:release
      - name: 🚀 Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: LEKTO_VERSION=${{ needs.tags.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.tags.outputs.revision }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
      - name: 📤 Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: ⬆️ Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The image's name last, so that a pattern names one image: `digests-*-lekto` does not
          # match `digests-amd64-lekto-migration`.
          name: digests-${{ matrix.platform.arch }}-${{ matrix.image.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 📦 ${{ matrix.image }}
    needs: [tags, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [lekto, lekto-migration]
    steps:
      - name: ⬇️ Download the digests
        if: matrix.image == 'lekto' || needs.tags.outputs.migration == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.image }}
          merge-multiple: true
      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 🔑 Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🚀 One manifest with the tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          TAGS: ${{ needs.tags.outputs.tags }}
          # The previous release's image, where it is not built again.
          REUSE: >-
            ${{ matrix.image == 'lekto-migration' && needs.tags.outputs.migration == 'reuse'
            && needs.tags.outputs.previous || '' }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$IMAGE:$tag"); done
          refs=()
          if [ -n "$REUSE" ]; then
            refs+=("$IMAGE:${REUSE#v}")
          else
            for digest in /tmp/digests/*; do refs+=("$IMAGE@sha256:${digest##*/}"); done
          fi
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
      - name: 🔍 Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ needs.tags.outputs.version }}
          TAGS: ${{ needs.tags.outputs.tags }}
          REUSED: >-
            ${{ matrix.image == 'lekto-migration' && needs.tags.outputs.migration == 'reuse'
            && needs.tags.outputs.previous || '' }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          {
            echo "### \`$IMAGE\`"
            if [ -n "$REUSED" ]; then echo "Unchanged since $REUSED: its image, not built again."; fi
            for tag in $TAGS; do echo "- \`$IMAGE:$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  homelab:
    name: 🏠 Homelab
    needs: [tags, publish]
    # Only a published release of this repository, not of a fork, and only the newest (`latest`):
    # a release of an older line or a release built again by hand would set the homelab back.
    if: >-
      github.repository == 'tb1337/lekto-dms'
      && github.event_name == 'release'
      && contains(format(' {0} ', needs.tags.outputs.tags), ' latest ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      VERSION: ${{ needs.tags.outputs.version }}
    steps:
      - name: 🔍 Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION is no version the homelab accepts"
            exit 1
          fi
      - name: 📣 Tell the homelab
        # The homelab's workflow is active only once it is on its default branch; until then a
        # failed dispatch must not mark the release red.
        continue-on-error: true
        env:
          REPO: ${{ secrets.HOMELAB_DISPATCH_REPO }}
          TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
        run: |
          if ! [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::The secret HOMELAB_DISPATCH_REPO holds no repository (owner/name)"
            exit 1
          fi
          body=$(jq -nc --arg version "$VERSION" \
            '{event_type: "lekto-release", client_payload: {version: $version}}')
          # The token goes to curl on stdin, never on a command line.
          status=$(printf 'Authorization: Bearer %s\n' "$TOKEN" | curl -sS -X POST \
            -H @- \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$body" \
            -o /tmp/response -w '%{http_code}' \
            "https://api.github.com/repos/$REPO/dispatches")
          if [ "$status" != "204" ]; then
            echo "::error::The homelab answered HTTP $status"
            cat /tmp/response
            exit 1
          fi
          echo "The homelab deploys $VERSION" >> "$GITHUB_STEP_SUMMARY"
