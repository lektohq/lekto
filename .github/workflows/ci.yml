name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels its running checks; every push to main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pytest runs with `-n logical`: `-n auto` counts physical cores, half of a runner's vCPUs, so
# the tests ran in half as many processes.

# Caches: only pushes to main write them, one entry per content (lock file; the OCR programs'
# packages per runner image); pull requests read main's entries. The uv cache is off:
# downloading the wheels is as fast as restoring them.
env:
  WRITE_CACHE: ${{ github.event_name == 'push' }}

jobs:
  # Which jobs the change needs. Jobs are skipped by `if`, not by `paths`, so that a skipped
  # job counts as passed for required checks.
  #
  # A pull request runs what its files touch; `integration`, `devcontainer` and `image` (the long
  # ones) wait until it is no draft, and `devcontainer` ignores lock files there. A push to main
  # runs the checks again only where they write a cache: `backend` (mypy) when the lock file
  # changed, `devcontainer` (layers) when its inputs or the lock file changed. Everything else was checked in the pull request, `image` too (it writes no cache).
  # `image` looks at what goes into the runtime image besides the code (Dockerfile, deploy/
  # without the Markdown files, the lock file, the web UI without its tests) and at the backend's
  # parts that work with the image's Debian programs (settings and startup, OCR, PDF, pictures,
  # system checks); the rest of the backend's code its tests cover. The release tests the image it
  # publishes once more (release.yml). `web` runs for changes below web/; on main only when its
  # lock file changed (to write the pnpm cache).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      integration: ${{ steps.diff.outputs.integration }}
      devcontainer: ${{ steps.diff.outputs.devcontainer }}
      image: ${{ steps.diff.outputs.image }}
      web: ${{ steps.diff.outputs.web }}
      migration: ${{ steps.diff.outputs.migration }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # Unknown base (new branch, force push): run everything.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=ALL
          fi
          echo "$files"
          matches() { [ "$files" = ALL ] || echo "$files" | grep -qE "$1"; }
          ci='^\.github/(workflows/ci\.yml|compose\.ci\.yml|scripts/ocr-packages\.sh)$'
          lock='^backend/(pyproject\.toml|uv\.lock)$'
          # web/openapi.json: a backend test compares it with the API; docs/configuration.md
          # one with the settings.
          code="^backend/|^web/openapi\.json$|^docs/configuration\.md$|^\.devcontainer/(compose\.yml|garage)|$ci"
          migration="^migration/|^web/openapi\.json$|$ci"
          # The backend's unit tests run the migration client against the API, too.
          backend_tests="$code|^migration/"
          web="^web/|^\.github/workflows/ci\.yml$"
          # The Compose examples, the release's tag script and the workflows.
          release="^docker/|^\.github/(scripts|workflows)/"
          image="^(Dockerfile|\.dockerignore)$|^\.devcontainer/|$ci"
          # The backend's parts that shape how the image behaves with its Debian programs: settings
          # and startup, OCR, PDF and pictures, the system checks (review 0.12.2, O-13).
          image_backend='^backend/src/lekto/(composition|adapters/outbound/(ocrmypdf|weasyprint|pdfium|pikepdf|pillow|zxing|system))/'
          runtime="^(Dockerfile|\.dockerignore)$|^deploy/|^web/|^\.github/workflows/ci\.yml$|$image_backend"
          # The runtime image's inputs. Documentation, the UI's tests and the API description (the
          # web job builds the client; its types leave nothing in the build) do not change it.
          not_in_image='^web/tests/|\.test\.ts$|^web/(openapi\.json|src/lib/api/schema\.ts|playwright\.config\.ts)$'
          runtime_changed() {
            [ "$files" = ALL ] || echo "$files" | grep -v '\.md$' \
              | grep -vE "$not_in_image" | grep -qE "$runtime|$lock"
          }
          if [ "$EVENT" = push ]; then
            matches "$lock|$ci" && echo "backend=true" >> "$GITHUB_OUTPUT"
            matches "$image|$lock" && echo "devcontainer=true" >> "$GITHUB_OUTPUT"
            matches "^web/pnpm-lock\.yaml$|$ci" && echo "web=true" >> "$GITHUB_OUTPUT"
            matches "$migration" && echo "migration=true" >> "$GITHUB_OUTPUT"
          else
            matches "$backend_tests" && echo "backend=true" >> "$GITHUB_OUTPUT"
            matches "$web" && echo "web=true" >> "$GITHUB_OUTPUT"
            matches "$migration" && echo "migration=true" >> "$GITHUB_OUTPUT"
            matches "$release" && echo "release=true" >> "$GITHUB_OUTPUT"
            if [ "$DRAFT" != true ]; then
              matches "$code" && echo "integration=true" >> "$GITHUB_OUTPUT"
              matches "$image" && echo "devcontainer=true" >> "$GITHUB_OUTPUT"
              runtime_changed && echo "image=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          exit 0

  # Lint, types and import contracts (`checks`), and the unit tests (the SQL adapter on SQLite
  # among them) in two parts side by side (`--shard`, backend/tests/conftest.py).
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: backend (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: checks
            run: |
              uv run ruff check .
              uv run ruff format --check .
              uv run mypy
              uv run lint-imports
          - part: tests 1/2
            run: uv run pytest -m unit -n logical --shard 1/2
          - part: tests 2/2
            run: uv run pytest -m unit -n logical --shard 2/2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv sync --locked
      # mypy's cache: most of its work are the dependencies, so one entry per lock file.
      - id: mypy-cache
        if: matrix.part == 'checks'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: backend/.mypy_cache
          key: mypy-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
      - run: ${{ matrix.run }}
      - if: >-
          matrix.part == 'checks' && env.WRITE_CACHE == 'true'
          && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: backend/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}

  # The migration client: lint, types and tests against stand-ins for both APIs, then its
  # image. Fast on purpose (httpx2 is its only dependency); its tests against the
  # real API run in `backend`.
  migration:
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # The image `lekto-migration` that each release publishes (`release.yml`).
      - run: docker build -t lekto-migration:ci .
      - run: docker run --rm lekto-migration:ci --help

  # What the release uses besides the images (pull requests only): the Compose examples in
  # docker/ with every extension (`docker compose config`, a .env with every value set), the tag
  # script's tests, and the workflows (actionlint).
  release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Tag script
        run: python3 -m unittest discover -s .github/scripts
      - name: Compose examples
        working-directory: docker
        run: |
          sed 's/^\([A-Z0-9_]*\)=$/\1=ci/' .env.example > .env
          check() { echo "compose $*"; docker compose "$@" config -q; }
          check -f compose.yml
          check -f compose.postgres.yml
          check -f compose.postgres.yml -f compose.workers.yml -f compose.s3.yml
          for extension in ollama caddy traefik nginx; do
            check -f compose.yml -f "compose.$extension.yml"
            check -f compose.postgres.yml -f "compose.$extension.yml"
          done
          check -f compose.yml -f compose.migration.yml --profile migration
      # The S3 example's Garage bootstrap is a copy of the dev container's (review 0.12.2, O-05):
      # it runs here, twice, as a user's `up` would run it on every start.
      - name: Garage of the S3 example
        working-directory: docker
        run: |
          sed -i '/^\(GARAGE_RPC_SECRET\|GARAGE_ADMIN_TOKEN\|LEKTO_S3_ACCESS_KEY_ID\|LEKTO_S3_SECRET_ACCESS_KEY\)=/d' .env
          {
            echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
            echo "GARAGE_ADMIN_TOKEN=$(openssl rand -hex 16)"
            echo "LEKTO_S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)"
            echo "LEKTO_S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)"
          } >> .env
          compose() { docker compose -f compose.postgres.yml -f compose.s3.yml "$@"; }
          compose up -d garage
          compose run --rm garage-init
          compose run --rm garage-init
          compose down -v
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # The web UI, in four parts side by side: lint and format; types, the generated API client
  # against web/openapi.json and the build; the unit tests (Vitest in jsdom) in two halves
  # (`--shard`, by file). Playwright runs locally only (no browsers here). The pnpm store is
  # cached per lock file, written from main only (by `lint`).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: lint
            run: |
              pnpm lint
              pnpm format:check
          - part: build
            run: |
              pnpm check
              pnpm gen:api && git diff --exit-code src/lib/api/schema.ts
              pnpm build
          - part: tests 1/2
            run: pnpm test --shard=1/2
          - part: tests 2/2
            run: pnpm test --shard=2/2
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - if: >-
          matrix.part == 'lint' && env.WRITE_CACHE == 'true'
          && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - run: ${{ matrix.run }}

  # The integration tests against the devcontainer's services (Postgres, Garage, Meilisearch,
  # GreenMail) and the OCR programs, on the runner, in two parts side by side (`--shard`), each
  # with services of its own. No test may skip. The OCR programs come from
  # the cache `ocr-packages` fills, without the network; else from the Ubuntu archive, within time
  # limits (.github/scripts/ocr-packages.sh). The step that sets them up fails within 5 minutes
  # and shows why, instead of waiting for a mirror until the job's limit.
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      COMPOSE: docker compose -f .devcontainer/compose.yml -f .github/compose.ci.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure like the dev container, with the services on localhost
        run: |
          $COMPOSE config --format json \
            | jq -r '.services.dev.environment | to_entries[] | "\(.key)=\(.value)"' \
            | sed -E 's#^LEKTO_DB_HOST=.*#LEKTO_DB_HOST=localhost#; s#//(garage|meilisearch|greenmail):#//localhost:#' \
            >> "$GITHUB_ENV"
      - id: ocr
        run: echo "key=$(.github/scripts/ocr-packages.sh key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/ocr-debs
          key: ${{ steps.ocr.outputs.key }}
      - name: Start the services and install the OCR programs, in parallel
        timeout-minutes: 5
        run: |
          .github/scripts/ocr-packages.sh install "$RUNNER_TEMP/ocr-debs" > "$RUNNER_TEMP/ocr.log" 2>&1 &
          ocr=$!
          $COMPOSE up -d --wait --wait-timeout 120 postgres meilisearch garage greenmail
          $COMPOSE run --rm garage-init
          status=0
          wait $ocr || status=$?
          cat "$RUNNER_TEMP/ocr.log"
          exit $status
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv sync --locked
        working-directory: backend
      - name: Run the integration tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -m integration -n logical --shard ${{ matrix.shard }} -v -rs --durations=20 \
            | tee pytest.log
          # pytest marks skipped tests as SKIPPED; test names may contain "skipped".
          if grep -q SKIPPED pytest.log; then
            echo "Integration tests were skipped: a service or program is missing" >&2
            exit 1
          fi
      - name: Show service logs
        if: failure()
        run: $COMPOSE logs

  # The .deb files of the OCR programs for `integration`, from main only (pull requests read its
  # caches): fetched once per runner image and script, a lookup otherwise.
  ocr-packages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: ocr
        run: echo "key=$(.github/scripts/ocr-packages.sh key)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/ocr-debs
          key: ${{ steps.ocr.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/ocr-packages.sh download "$RUNNER_TEMP/ocr-debs"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/ocr-debs
          key: ${{ steps.ocr.outputs.key }}

  # The dev image, only when its inputs change. First amd64: the devcontainer's services start
  # like "Reopen in Container", Garage's init is repeatable, and the image's own OCR programs
  # work (`integration` tests the code). The build also writes the layer
  # cache: one scope, only from main. arm64 (Apple Silicon) is not built here: emulated, it was
  # slow and filled the runner's disk.
  devcontainer:
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f .devcontainer/compose.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      # The tag is the image name Compose uses for `dev`.
      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          load: true
          tags: lekto-dev-dev:latest
          cache-from: type=gha,scope=dev-image
          cache-to: ${{ env.WRITE_CACHE == 'true' && 'type=gha,scope=dev-image,mode=max' || '' }}
      - name: Start the services
        # Uses the image built above; builds only the small garage-init image.
        run: $COMPOSE up -d dev
      - name: Run Garage init a second time
        run: $COMPOSE run --rm garage-init
      - name: Check the tools in the dev container
        # As root: the checkout belongs to the runner user, not to the container's `vscode` user.
        run: |
          $COMPOSE exec -T -u root dev bash -e -o pipefail -c '
            uv sync --locked --project backend
            cd backend
            uv run pytest -n logical -v -rs tests/integration/test_services_reachable.py \
              tests/integration/adapters/ocrmypdf tests/integration/adapters/pdfium \
              | tee /tmp/pytest.log
            # pytest marks skipped tests as SKIPPED; test names may contain "skipped".
            if grep -q SKIPPED /tmp/pytest.log; then
              echo "Tests were skipped: a service or program is missing" >&2
              exit 1
            fi
          '
      - name: Check the pinned Claude Code in the dev container
        run: |
          wanted=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' Dockerfile)
          $COMPOSE exec -T dev /home/vscode/.local/bin/claude --version | grep -q "^$wanted "
      - name: Show service logs
        if: failure()
        run: $COMPOSE logs

  # The runtime image, only when its inputs change, natively on each architecture (amd64 and
  # arm64 side by side; the arm64 runner replaces the emulation that was slow and filled the
  # disk). Builds the image without pushing it, then `deploy/test-image.sh` starts it with
  # SQLite: migration, health, user (never root), roles, a PDF through OCR and parsing, stop.
  # No layer cache: measured, a cold build takes 2.5 minutes, while restoring the cache takes
  # about one minute and writing it two more, and it would take space from the 10 GB of the
  # repository's caches. The image goes into the runner's Docker with zstd layers: packing them
  # took a third of gzip's time (locally 18 instead of 41 seconds), the image is as large.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Build the runtime image
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          outputs: type=docker,compression=zstd,force-compression=true
          tags: lekto:ci
      - name: Size of the image
        run: docker image inspect lekto:ci --format 'image size {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test the image
        timeout-minutes: 8
        run: deploy/test-image.sh lekto:ci
