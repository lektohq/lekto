# Overrides .devcontainer/compose.yml for the CI job `integration`: the tests run on the runner,
# so the services publish their ports there.
services:
  postgres:
    # The job's databases need not survive a crash: without fsync the tests take a quarter less
    # time, and DROP DATABASE (its checkpoint) no longer takes up to half a minute.
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    ports:
      - 5432:5432
  garage:
    ports:
      - 3900:3900
  meilisearch:
    ports:
      - 7700:7700
  greenmail:
    ports:
      - 3143:3143
      - 8080:8080
